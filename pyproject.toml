[project]
name = "propagate-yourself"
version = "0.1.0"
description = "CT viewer and jwave focused-ultrasound simulation mirrored from openlifu's k-Wave flow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.4.20,<0.5.0",
    "jwave>=0.2.1",
    "matplotlib>=3.11.1",
    "napari[pyqt6]>=0.9.0",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "simpleitk>=2.5.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
